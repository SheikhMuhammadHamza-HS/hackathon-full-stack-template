[project]
name = "hackathon-todo-backend"
version = "0.1.0"
description = "FastAPI backend for Multi-User Authentication System with AI Chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "pyjwt>=2.10.0",
    "pydantic[email]>=2.10.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.2.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
    # Phase III: AI Chatbot dependencies
    "openai>=1.59.0",
    "openai-agents>=0.0.3",
    "slowapi>=0.1.9",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]
